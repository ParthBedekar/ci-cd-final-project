apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      default: https://github.com/ParthBedekar/ci-cd-final-project.git
    - name: branch
      type: string
      default: main
    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-parthbedekar/counter-service:latest
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      runAfter: [cleanup]
      workspaces:
        - name: output
          workspace: pipeline-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)

    - name: eslint
      taskRef:
        name: eslint
      runAfter: [git-clone]
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: jest-test
      taskRef:
        name: jest-test
      runAfter: [eslint]
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: buildah
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter: [jest-test]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: ./Dockerfile

    - name: deploy
      taskRef:
        name: openshift-client
        kind: ClusterTask
      runAfter: [buildah]
      params:
        - name: SCRIPT
          value: |
            oc create deployment counter-service --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
