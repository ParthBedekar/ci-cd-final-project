apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -delete
        else
          echo "${WORKSPACE_SOURCE_PATH} does not exist."
        fi
        echo "Cleanup complete."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: node:18-alpine
      script: |
        #!/usr/bin/env sh
        set -eu
        cp -r $(workspaces.source.path) /tmp/app
        cd /tmp/app
        npm config set fetch-retries 3
        timeout 300 npm ci --no-audit --no-fund
        npm run lint
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:18-alpine
      script: |
        #!/usr/bin/env sh
        set -eu
        cp -r $(workspaces.source.path) /tmp/app
        cd /tmp/app
        npm config set fetch-retries 3
        timeout 300 npm ci --no-audit --no-fund
        npm test
